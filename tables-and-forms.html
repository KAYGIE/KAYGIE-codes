<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Tables</title>
</head>

<body>
  
  <h3>Cars - Table Type 1</h3>
  <table bgcolor="black" width="360">
    
    <tr align="center" bgcolor="darkgrey">
      <th width="30" bgcolor="grey">Car name</th>
      <td width="30">Golf 7.5R</td>
      <td width="30">G-Class G63</td>
      <td width="30">Hilux DC 2.8GD6</td>
    </tr>
    
    <tr align="center" bgcolor="darkgrey">
      <th width="30" bgcolor="grey">Year</th>
      <td width="30">2019</td>
      <td width="30">2020</td>
      <td width="30">2020</td>
    </tr>
    
    <tr align="center" bgcolor="darkgrey">
      <th width="30" bgcolor="grey">Colour</th>
      <td width="30">Blue</td>
      <td width="30">Blue</td>
      <td width="30">Bronze</td>
    </tr>
  </table>
  
  <h3>Cars - Table Type 2</h3>
  
  <table bgcolor="black" width="360">
    <tr align="center" bgcolor="grey">
      <th width="30">Car Name</th>
      <th width="30">Year</th>
      <th width="30">Colour</th>
    </tr>
    
     <tr align="center" bgcolor="lightgrey">
      <td width="30">Golf 7.5 R</td>
      <td width="30">2020</td>
      <td width="30">Blue</td>
    </tr>
    
    <tr align="center" bgcolor="lightgrey">
      <td width="30">G-Class G63</td>
      <td width="30">2020</td>
      <td width="30">Blue</td>
    </tr>
    
    <tr align="center" bgcolor="lightgrey">
      <td width="30">Hilux DC 2.8 GD6</td>
      <td width="30">2018</td>
      <td width="30">Bronze</td>
    </tr>
    
  </table>
  <br>
  <br>
  <h3>Form template</h3>
  <form>
    
    <label for="fname">First Name:</label>
    <input type="text" id="fname" placeholder="firstname"><br>
    
    <label for="lname">Last Name:</label>
    <input type="text" id="lname" placeholder="lastname"><br>
    
    <label for="password">Password:</label>
    <input type="password" id="password" minlength="6" maxlength="10"><br>
    
    <label for="bdate">Date of Birth:</label>
    <input type="date" id="bdate"><br>
    
    <label for="tel">Cellphone No.:</label>
    <input type="tel" id="tel" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>
    
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="email@gmail.com"><br>
    
    <label for="cars">Type of cars:</label>
    <select id="cars">
      <option value="Golf 7">Golf 7</option>
      <option value="G63">G63</option>
      <option value="Hilux">Hilux</option>
    </select><br>
    
    <label for="title">Title:</label>
    
    <label for="Mr">Mr</label>
    <input type="radio" id="Mr" name="title" value="Mr">
    
    <label for="Mrs">Mrs </label>
    <input type="radio" id="Mrs" name="title" value="Mrs">
    
    <label for="PhD">PhD</label>
    <input type="radio" id="PhD" name="title" value="PhD"><br>
    
    <label for="quantity">Orders:</label>
    <input type="number" id="quantity" min="0" max="5" value="1"><br>
    
    <label for="sub">Subscribe:</label>
    <input type="checkbox" id="sub"><br>
    
    <br>
    <input type="submit">
    <br>
    <br>
    <input type="Reset">
    
  </form>
  
</body>

</html>
